- insert:
    - id: preset-mobile
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: mobile
        name: mobile
        plugins:
          # The `mobile` agent preset: a mobile-focused coding agent that can operate an
          # Android device through the Banyan Android bridge and extend its running DSH
          # host with Cordis plugins.

          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.
                You can observe and operate an attached Android device through the local Banyan Android bridge.

                You can inspect the running DSH host through the read-only Cordis inspection tools. Keep extensions in separate reviewed plugin packages. Native Android UI, permissions, and packaged runtime changes require an app rebuild.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: true

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: true

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # Read-only runtime discovery.
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: mobile
            name: cordis:group
            group: true
            isolate:
              mobile: true
            config:
              - id: mobile-runtime
                name: '@deepseek-ai/dsh-mobile'
                config:
                  provider: android-http

              - id: mobile-bridge-http
                name: '@deepseek-ai/dsh-mobile-bridge-http'
                config:
                  baseUrl: !!js process.env.DSH_ANDROID_BRIDGE_URL ?? 'http://127.0.0.1:8765'

              - id: tool-mobile
                name: '@deepseek-ai/dsh-tool-mobile'
                config:
                  observeScreenshotAdbPath: !!js process.env.DSH_MOBILE_OBSERVE_SCREENSHOT_ADB_PATH ?? process.env.DSH_MOBILE_VISION_ADB_PATH ?? 'adb'
                  observeScreenshotAdbSerial: !!js process.env.ANDROID_SERIAL ?? ''
                  observeScreenshotReportsDir: !!js process.env.DSH_MOBILE_OBSERVE_SCREENSHOT_REPORT_DIR ?? ''
                  visualStep: !!js process.env.DSH_MOBILE_VISUAL_STEP === '1'
                  visionModel: !!js process.env.DSH_MOBILE_VISION_MODEL ?? 'deepseek-v4-flash-vision-exp'
                  visionBaseUrl: !!js process.env.DSH_MOBILE_VISION_BASE_URL ?? 'https://api.deepseek.com'
                  visionApiKeyEnv: !!js process.env.DSH_MOBILE_VISION_API_KEY_ENV ?? 'DEEPSEEK_API_KEY'
                  visionKeyFile: !!js process.env.DSH_MOBILE_VISION_KEY_FILE ?? ''
                  visionKeyFileLine: !!js Number(process.env.DSH_MOBILE_VISION_KEY_FILE_LINE ?? '1')
                  visionAdbPath: !!js process.env.DSH_MOBILE_VISION_ADB_PATH ?? 'adb'
                  visionAdbSerial: !!js process.env.ANDROID_SERIAL ?? ''
                  visionReportsDir: !!js process.env.DSH_MOBILE_VISUAL_REPORT_DIR ?? ''
                  visionScreenWidth: !!js Number(process.env.DSH_MOBILE_VISION_SCREEN_WIDTH ?? '1280')
                  visionScreenHeight: !!js Number(process.env.DSH_MOBILE_VISION_SCREEN_HEIGHT ?? '2856')
