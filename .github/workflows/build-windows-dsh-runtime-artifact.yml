name: Build Windows DSH Runtime Artifact

on:
  workflow_dispatch:
    inputs:
      target_platform:
        description: "Target platform label"
        required: true
        default: "windows-x64"
      prune_profile:
        description: "Prune profile under runtime/build/prune-rules"
        required: true
        type: choice
        options:
          - windows-host-slim
          - full
        default: "windows-host-slim"
      dsh_package:
        description: "pnpm filter package to deploy"
        required: true
        default: "@deepseek-ai/dsh"
      build_command:
        description: "Build command run before deploy"
        required: true
        default: "pnpm run build"

jobs:
  build:
    name: Build Windows runtime
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout DSH
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          node --version
          pnpm --version

      - name: Locate pnpm store
        id: pnpm-store
        shell: pwsh
        run: |
          "path=$(pnpm store path --silent)" >> $env:GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: dsh-runtime-pnpm-windows-${{ hashFiles('pnpm-lock.yaml', 'runtime/build/prune-rules/*.env') }}
          restore-keys: |
            dsh-runtime-pnpm-windows-

      - name: Build Windows DSH runtime artifact
        shell: bash
        env:
          DSH_REPO: ${{ github.server_url }}/${{ github.repository }}
          DSH_REF: ${{ github.ref_name }}
          TARGET_PLATFORM: ${{ inputs.target_platform }}
          PRUNE_PROFILE: ${{ inputs.prune_profile }}
          DSH_PACKAGE: ${{ inputs.dsh_package }}
          DSH_BUILD_COMMAND: ${{ inputs.build_command }}
          DSH_RUNTIME_FAST_STATS: "true"
        run: |
          mkdir -p "$PWD/build/dsh-runtime-artifacts"
          ARTIFACT_DIR="$PWD/build/dsh-runtime-artifacts" \
            bash runtime/build/build-dsh-runtime-artifact.sh --dsh-source-dir "$GITHUB_WORKSPACE"

      - name: Upload Windows DSH runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-runtime-${{ inputs.target_platform }}-${{ inputs.prune_profile }}
          path: |
            build/dsh-runtime-artifacts/*.tar.gz
            build/dsh-runtime-artifacts/*.tar.gz.sha256
            build/dsh-runtime-artifacts/*.manifest.json
          if-no-files-found: error
